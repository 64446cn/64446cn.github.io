  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  /* ------------------------------------------------------------------ */
  /* 滑块：只有按住圆点拖动才改变数值，点击轨道不会跳变                   */
  /* ------------------------------------------------------------------ */

  function setSliderValue(slider, value) {
    value = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
    slider.dataset.value = String(value);
    slider.style.setProperty('--v', String(value));
    slider.setAttribute('aria-valuenow', String(value));
    return value;
  }

  function getSliderValue(slider) {
    return Number(slider.dataset.value || 0);
  }

  function sliderMetrics(slider) {
    var rect = slider.getBoundingClientRect();
    var pad = 9.5;
    return {
      left: rect.left + pad,
      width: Math.max(1, rect.width - pad * 2)
    };
  }

  function createSlider(slider, onComplete) {
    if (!slider || slider.dataset.ready === '1') return;
    var thumb = slider.querySelector('.slider-thumb');
    if (!thumb) return;
    slider.dataset.ready = '1';
    setSliderValue(slider, 0);

    var dragging = false;
    var pointerId = null;

    function onPointerMove(event) {
      if (!dragging) return;
      if (pointerId !== null && event.pointerId !== pointerId) return;
      var metrics = sliderMetrics(slider);
      var value = (event.clientX - metrics.left) / metrics.width * 100;
      setSliderValue(slider, value);
    }

    function endDrag(event) {
      if (!dragging) return;
      if (pointerId !== null && event && event.pointerId !== pointerId) return;
      dragging = false;
      slider.classList.remove('dragging');
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', endDrag);
      window.removeEventListener('pointercancel', endDrag);
      var value = getSliderValue(slider);
      setSliderValue(slider, 0);
      pointerId = null;
      if (value >= 96 && onComplete) onComplete();
    }

    thumb.addEventListener('pointerdown', function (event) {
      if (event.button != null && event.button !== 0) return;
      event.preventDefault();
      dragging = true;
      pointerId = event.pointerId == null ? null : event.pointerId;
      slider.classList.add('dragging');
      try { thumb.setPointerCapture(event.pointerId); } catch (err) { /* ignore */ }
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', endDrag);
      window.addEventListener('pointercancel', endDrag);
    });

    slider.addEventListener('keydown', function (event) {
      var current = getSliderValue(slider);
      var next = null;
      if (event.key === 'ArrowRight' || event.key === 'ArrowUp') next = current + 5;
      else if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') next = current - 5;
      else if (event.key === 'End') next = 100;
      else if (event.key === 'Home') next = 0;
      if (next === null) return;
      event.preventDefault();
      next = setSliderValue(slider, next);
      if (next >= 96) {
        setSliderValue(slider, 0);
        if (onComplete) onComplete();
      }
    });
  }

  function clearToast() {
    clearTimeout(toastTimer);
    toastSeq += 1;
    undoAction = null;
    els.toast.classList.remove('show');
    els.toast.hidden = true;
    els.toast.innerHTML = '';
  }

  function showToast(message, undoFn) {
    clearToast();
    var seq = toastSeq;
    undoAction = undoFn || null;
    els.toast.innerHTML = '<span class="toast-msg">' + esc(message) + '</span>' +
      (undoFn ? '<button type="button" class="toast-undo" id="toastUndo">撤销</button>' : '');
    els.toast.hidden = false;
    requestAnimationFrame(function () { els.toast.classList.add('show'); });
    toastTimer = setTimeout(function () {
      if (seq !== toastSeq) return;
      els.toast.classList.remove('show');
      setTimeout(function () {
        if (seq !== toastSeq) return;
        els.toast.hidden = true;
        els.toast.innerHTML = '';
        undoAction = null;
      }, 260);
    }, 5000);
  }

  function openOverlay(html, options) {
    options = options || {};
    if (activeModal) closeOverlay();
    var previousFocus = document.activeElement;
    els.overlay.innerHTML = '<div class="modal' + (options.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
    els.overlay.hidden = false;
    document.body.classList.add('modal-open');
    activeModal = {
      closable: options.closable !== false,
      onClose: options.onClose || null,
      previousFocus: previousFocus
    };
    requestAnimationFrame(function () {
      var focusTarget = els.overlay.querySelector('[data-autofocus]') ||
        els.overlay.querySelector('input, textarea, button');
      if (focusTarget) {
        focusTarget.focus();
        if (focusTarget.setSelectionRange && focusTarget.value) {
          try { focusTarget.setSelectionRange(focusTarget.value.length, focusTarget.value.length); } catch (err) { /* ignore */ }
        }
      }
    });
  }

  function closeOverlay() {
    if (!activeModal) return;
    var modal = activeModal;
    activeModal = null;
    if (modal.onClose) {
      try { modal.onClose(); } catch (err) { /* ignore */ }
    }
    els.overlay.hidden = true;
    els.overlay.innerHTML = '';
    document.body.classList.remove('modal-open');
    if (modal.previousFocus && typeof modal.previousFocus.focus === 'function') {
      try { modal.previousFocus.focus(); } catch (err) { /* ignore */ }
    }
  }

  function confirmDialog(options) {
    options = options || {};
    return new Promise(function (resolve) {
      var settled = false;
      function finish(value) {
        if (settled) return;
        settled = true;
        resolve(value);
      }
      var html =
        '<div class="modal-head"><h3>' + esc(options.title || '确认') + '</h3>' +
        '<button type="button" class="icon-btn" data-modal-close aria-label="关闭">×</button></div>' +
        '<div class="modal-body"><p class="modal-text">' + esc(options.message || '') + '</p></div>' +
        '<div class="modal-foot">' +
        '<button type="button" class="btn" data-modal-close>取消</button>' +
        '<button type="button" class="btn primary' + (options.danger ? ' danger' : '') + '" id="confirmOk">' + esc(options.okText || '确定') + '</button>' +
        '</div>';
      openOverlay(html, {
        onClose: function () { finish(false); }
      });
      els.overlay.querySelectorAll('[data-modal-close]').forEach(function (btn) {
        btn.addEventListener('click', function () { closeOverlay(); });
      });
      els.overlay.querySelector('#confirmOk').addEventListener('click', function () {
        finish(true);
        closeOverlay();
      });
    });
  }

  /* ------------------------------------------------------------------ */
  /* 渲染：计时区                                                        */
  /* ------------------------------------------------------------------ */

  function renderClock() {
    var suffix = core.state.current ? '' : '（无事项）';
    els.clock.textContent = Core.formatDate(new Date()) + suffix;
  }

  function renderTimer() {
    var s = core.state;

    els.timerCard.dataset.status = s.status;
    els.timerCard.dataset.running = s.running ? 'true' : 'false';

    var phase = STATUS_LABELS[s.status] || '专注';
    var stateText = s.focusEnded ? '本轮完成 · 等待休息' : (s.breakEnded ? '已结束 · 超时中' : (s.running ? '计时中' : '已暂停'));
    els.phaseText.textContent = phase + ' · ' + stateText;

    var mainText;
    if (s.focusEnded) {
      mainText = '+' + Core.formatClock(Math.max(0, s.elapsed - core.defaultSeconds('focus')));
    } else if (s.breakEnded) {
      mainText = '+' + Core.formatClock(s.overtime);
    } else {
      mainText = Core.formatClock(s.remaining);
    }
    els.mainClock.textContent = mainText;
    els.mainClock.classList.toggle('overtime', s.focusEnded || s.breakEnded);

    var tomatoHtml = '<span class="tomato-label">剩余番茄</span>';
    for (var i = 0; i < Core.MAX_TOMATOES; i++) {
      tomatoHtml += '<span class="tomato' + (i < s.tomatoes ? ' on' : '') + '" aria-hidden="true">🍅</span>';
    }
    els.tomatoes.innerHTML = tomatoHtml;
    els.tomatoes.setAttribute('aria-label', '已完成 ' + s.tomatoes + ' / ' + Core.MAX_TOMATOES + ' 个番茄');

    els.sessionClock.textContent = Core.formatClock(s.elapsed);
    if (s.current) {
      els.currentTaskName.textContent = s.current.name;
      els.currentTaskName.classList.toggle('compact', s.current.name.length > 9);
      els.currentTaskClock.textContent = Core.formatClock(s.durations[s.current.id] || 0);
    } else {
      els.currentTaskName.textContent = '无事项';
      els.currentTaskName.classList.remove('compact');
      els.currentTaskClock.textContent = '00:00';
    }

    var phaseLabel = '当前状态：' + phase + ' · ' + (s.focusEnded ? '等待休息' : (s.breakEnded ? '休息结束' : (s.running ? '计时中' : '已暂停')));
    els.statusLine.textContent = phaseLabel;
  }

  function sliderHtml(which, label, hint) {
    return '<div class="slide">' +
      '<div class="slider" role="slider" tabindex="0" data-slide="' + which + '" data-value="0" ' +
      'aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" ' +
      'aria-label="' + esc(label + '，' + (hint || '拖到最右端触发')) + '">' +
      '<div class="slider-track"><div class="slider-fill"></div><div class="slider-thumb"></div></div>' +
      '</div>' +
      '<span class="slide-label">' + esc(label) + '<span class="slide-arrow">→</span></span></div>';
  }

  function renderControls() {
    var s = core.state;
    var html = '';
    if (s.focusEnded) {
      var rest = '<button type="button" class="btn primary" data-cmd="break-short">短休息</button>';
      if (s.tomatoes >= Core.MAX_TOMATOES) {
        rest += '<button type="button" class="btn" data-cmd="break-long">长休息</button>';
      }
      html = '<div class="control-main">' +
        '<div class="control-side left"></div>' +
        '<div class="focus-actions">' + rest + '</div>' +
        '<div class="control-side right"></div>' +
        '</div>' +
        '<span class="control-note">本轮专注已完成，选择休息</span>';
    } else if (s.running) {
      html = '<div class="control-main">' +
        '<div class="control-side left"></div>' +
        '<div class="primary-wrap"><button type="button" class="btn primary" data-cmd="pause">暂停</button></div>' +
        '<div class="control-side right"></div>' +
        '</div>' +
        '<div class="control-slide">' + sliderHtml('finish', '提前结束', '拖到最右端提前结束本阶段') + '</div>';
    } else {
      var left = '<button type="button" class="btn" data-cmd="reset">重置</button>' +
        '<button type="button" class="btn" data-cmd="switch">切换状态</button>';
      var right = '<button type="button" class="btn" data-cmd="newday">新的一天</button>';
      if (s.status === 'long') {
        right += '<button type="button" class="btn" data-cmd="convert">转换为短休息</button>';
      }
      html = '<div class="control-main">' +
        '<div class="control-side left">' + left + '</div>' +
        '<div class="primary-wrap"><button type="button" class="btn primary" data-cmd="resume">继续</button></div>' +
        '<div class="control-side right">' + right + '</div>' +
        '</div>' +
        '<div class="control-slide">' + sliderHtml('finish', '提前结束', '拖到最右端提前结束本阶段') + '</div>';
    }
    els.controls.innerHTML = html;
    els.controls.querySelectorAll('.slider[data-slide="finish"]').forEach(function (slider) {
      createSlider(slider, doFinishEarly);
    });
  }

  /* ------------------------------------------------------------------ */
  /* 渲染：事项本 / 表格 / 统计 / 笔记                                    */
  /* ------------------------------------------------------------------ */

  function taskItemHtml(task, level, index, total) {
    return '<div class="task" data-id="' + esc(task.id) + '" data-level="' + level + '">' +
      '<span class="task-name" title="' + esc(task.name) + '">' + esc(task.name) + '</span>' +
      '<div class="task-actions">' +
      '<button type="button" class="icon-btn flag-btn" data-act="flag" title="设为正在完成" aria-label="将 ' + esc(task.name) + ' 设为正在完成">🚩</button>' +
      '<button type="button" class="icon-btn" data-act="edit" title="修改名称或级别" aria-label="修改 ' + esc(task.name) + '">🖊</button>' +
      '<button type="button" class="icon-btn" data-act="up" title="上移" aria-label="上移" ' + (index === 0 ? 'disabled' : '') + '>↑</button>' +
      '<button type="button" class="icon-btn" data-act="down" title="下移" aria-label="下移" ' + (index === total - 1 ? 'disabled' : '') + '>↓</button>' +
      '<button type="button" class="icon-btn danger-text" data-act="del" title="删除" aria-label="删除 ' + esc(task.name) + '">×</button>' +
      '</div></div>';
  }

  function sectionHtml(level, list) {
    var items = list.map(function (task, index) {
      return taskItemHtml(task, level, index, list.length);
    }).join('');
    return '<section class="task-section" data-level="' + level + '">' +
      '<div class="section-head">' +
      '<span class="level-dot ' + level + '"></span>' +
      '<h3>' + LEVEL_LABELS[level] + '</h3>' +
      '<span class="count">' + list.length + '</span>' +
      '</div>' +
      (list.length ? '<div class="task-list">' + items + '</div>' : '<div class="empty-line">暂无事项</div>') +
      '</section>';
  }

  function renderTasks() {
    var s = core.state;

    var currentHtml =
      '<div class="section-head">' +
      '<span class="level-dot current"></span>' +
      '<h3>正在完成的事项</h3>' +
      '<span class="count">' + (s.current ? 1 : 0) + '</span>' +
      '<span class="head-hint">只能有一项</span>' +
      '</div>';
    if (s.current) {
      currentHtml += '<div class="task current-task" data-id="' + esc(s.current.id) + '">' +
        '<span class="current-pulse" aria-hidden="true"></span>' +
        '<span class="task-name" title="' + esc(s.current.name) + '">' + esc(s.current.name) + '</span>' +
        '<button type="button" class="done-btn" data-act="done" title="完成事项" aria-label="完成 ' + esc(s.current.name) + '">√</button>' +
        '</div>';
    } else {
      currentHtml += '<div class="empty-current">点击下方事项的 🚩 把它设为正在完成</div>';
    }
    els.currentSection.innerHTML = currentHtml;

    els.sectionsHost.innerHTML = LEVELS.map(function (level) {
      return sectionHtml(level, s.lists[level]);
    }).join('');

    var completed = s.completed;
    var completedHtml =
      '<div class="section-head">' +
      '<span class="level-dot done"></span>' +
      '<h3>已完成的事项</h3>' +
      '<span class="count">' + completed.length + '</span>' +
      (completed.length ? '<button type="button" class="icon-btn clear-done" data-act="clear-done" title="清空所有已完成" aria-label="清空所有已完成">×</button>' : '') +
      '</div>';
    if (completed.length) {
      completedHtml += '<div class="task-list">' + completed.map(function (task) {
        return '<div class="task completed-task" data-id="' + esc(task.id) + '">' +
          '<span class="task-name" title="' + esc(task.name) + '">' + esc(task.name) + '</span>' +
          '<button type="button" class="icon-btn" data-act="return" title="退回到原位置" aria-label="将 ' + esc(task.name) + ' 退回">←</button>' +
          '</div>';
      }).join('') + '</div>';
    } else {
      completedHtml += '<div class="empty-line">完成的事项会出现在这里</div>';
    }
    els.completedSection.innerHTML = completedHtml;
  }

  function renderTable() {
    var rows = core.tableRows();
    if (!rows.length) {
      els.tableBody.innerHTML = '<tr><td colspan="2" class="empty-line">暂无事项，添加后这里会实时显示用时</td></tr>';
      return;
    }
    els.tableBody.innerHTML = rows.map(function (row) {
      return '<tr class="' + (row.status === 'completed' ? 'is-done' : '') + (row.status === 'current' ? ' is-current' : '') + '">' +
        '<td><span class="row-name">' + esc(row.name) + '</span>' +
        (row.status === 'current' ? '<span class="row-tag">进行中</span>' : '') + '</td>' +
        '<td class="time">' + Core.formatTable(row.duration) + '</td>' +
        '</tr>';
    }).join('');
  }

  function renderNotePreview() {
    var notes = core.state.notes;
    if (notes) {
      els.notePreview.textContent = notes;
      els.notePreview.classList.remove('empty');
    } else {
      els.notePreview.textContent = '还没有笔记，点击「笔记板书写」记录灵感。';
      els.notePreview.classList.add('empty');
    }
  }

  function renderTotals() {
    els.focusTotal.textContent = Core.formatTable(core.focusTotal());
    els.breakTotal.textContent = Core.formatTable(core.state.breakTotal);
  }

  function renderStats() {
    renderTotals();
    renderNotePreview();
  }

  function renderDevValues() {
    els.devFocus.value = core.state.settings.focus;
    els.devShort.value = core.state.settings.short;
    els.devLong.value = core.state.settings.long;
  }

  function renderAll() {
    renderTimer();
    renderControls();
    renderTasks();
    renderTable();
    renderStats();
    renderClock();
  }

  /* ------------------------------------------------------------------ */
  /* 操作                                                                */
  /* ------------------------------------------------------------------ */

  function undoHandler(snapshot, label) {
    return function () {
      core.restore(snapshot);
      stopBreakLoop();
      renderAll();
      renderDevValues();
      scheduleSave();
      showToast('已撤销：' + label);
    };
  }

  function doReset() {
    var snapshot = core.snapshot();
    if (!core.reset()) return;
    renderAll();
    scheduleSave();
    showToast('已重置本阶段计时', undoHandler(snapshot, '重置'));
  }

  function doFinishEarly() {
    var s = core.state;
    if (s.status === 'focus' && !s.current) {
      resetFinishSlider();
      showToast('请先在待办事项本中选择正在完成的事项');
      return;
    }
    if (s.focusEnded || s.breakEnded) {
      resetFinishSlider();
      return;
    }
    var wasFocus = s.status === 'focus';
    var snapshot = core.snapshot();
    if (!core.finishEarly()) {
      resetFinishSlider();
      return;
    }
    renderAll();
    scheduleSave();
    var message;
    if (wasFocus) {
      message = core.state.status === 'long' ? '已提前结束专注，开始长休息' : '已提前结束专注，开始短休息';
    } else if (core.state.running) {
      message = '已提前结束休息，开始专注';
    } else {
      message = '已提前结束休息，请选择正在完成的事项';
    }
    showToast(message, undoHandler(snapshot, '提前结束'));
  }

  function resetFinishSlider() {
    els.controls.querySelectorAll('.slider[data-slide="finish"]').forEach(function (slider) {
      setSliderValue(slider, 0);
    });
  }

  function doSwitchStatus() {
    var snapshot = core.snapshot();
    if (!core.switchStatus()) return;
    renderAll();
    scheduleSave();
    showToast('已切换为' + STATUS_LABELS[core.state.status] + '（暂停）', undoHandler(snapshot, '切换状态'));
  }

  function doNewDay() {
    confirmDialog({
      title: '开始新的一天',
      message: '将清空所有事项、累计专注时长和统计，笔记会保留。此操作不可撤销。',
      okText: '开始新的一天',
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      stopBreakLoop();
      core.newDay();
      renderAll();
      scheduleSave();
      showToast('新的一天已开始，短休息计时中');
    });
  }

  function doConvert() {
    if (!core.convertLongToShort()) return;
    renderAll();
    scheduleSave();
    showToast('已转换为短休息，计时开始');
  }

  function openAddModal() {
    var draft = core.state.draft;
    var committed = false;
    var html =
      '<div class="modal-head"><h3>添加事项</h3><button type="button" class="icon-btn" data-modal-close aria-label="关闭">×</button></div>' +
      '<div class="modal-body">' +
      '<p class="modal-hint">每行一个事项：行首 <b>1</b> = 紧急，<b>2</b> = 一般，其他 = 不紧急。</p>' +
      '<textarea id="addInput" data-autofocus maxlength="5000" placeholder="1 写论文&#10;2 背单词&#10;整理今天的笔记"></textarea>' +
      '<div class="clear-slide">' + sliderHtml('clear', '清空', '拖到最右端清空输入框') + '</div>' +
      '</div>' +
      '<div class="modal-foot">' +
      '<button type="button" class="btn" data-modal-close>取消</button>' +
      '<button type="button" class="btn primary" id="addOk">确定</button>' +
      '</div>';

    var input;
    openOverlay(html, {
      onClose: function () {
        if (draftTimer) clearTimeout(draftTimer);
        if (committed) {
          core.setDraft('');
        } else if (input) {
          core.setDraft(input.value);
        }
        saveNow();
      }
    });

    input = els.overlay.querySelector('#addInput');
    input.value = draft;

    input.addEventListener('input', function () {
      clearTimeout(draftTimer);
      draftTimer = setTimeout(function () {
        core.setDraft(input.value);
        scheduleSave();
      }, 400);
    });

    els.overlay.querySelectorAll('[data-modal-close]').forEach(function (btn) {
      btn.addEventListener('click', closeOverlay);
    });

    var clearSlider = els.overlay.querySelector('.slider[data-slide="clear"]');
    createSlider(clearSlider, function () {
      input.value = '';
      core.setDraft('');
      scheduleSave();
      input.focus();
    });

    els.overlay.querySelector('#addOk').addEventListener('click', function () {
      var text = input.value;
      var count = core.addTasks(text);
      if (!count) {
        showToast('没有可添加的事项，请每行输入一个名称');
        return;
      }
      committed = true;
      core.setDraft('');
      closeOverlay();
      renderAll();
      scheduleSave();
      showToast('已添加 ' + count + ' 个事项');
    });
  }

  function openEditModal(id) {
    var row = core.tableRows().filter(function (item) { return item.id === id; })[0];
    if (!row) return;
    var html =
      '<div class="modal-head"><h3>修改事项</h3><button type="button" class="icon-btn" data-modal-close aria-label="关闭">×</button></div>' +
      '<div class="modal-body">' +
      '<label class="field-label" for="editName">事项名称</label>' +
      '<input id="editName" data-autofocus type="text" maxlength="120" value="' + esc(row.name) + '">' +
      '<span class="field-label">事项级别</span>' +
      '<div class="level-picker">' + LEVELS.map(function (level) {
        return '<label class="level-option ' + level + '">' +
          '<input type="radio" name="editLevel" value="' + level + '"' + (level === row.level ? ' checked' : '') + '>' +
          '<span>' + LEVEL_LABELS[level] + '</span></label>';
      }).join('') + '</div>' +
      '<p class="modal-hint">改名或改级别不会丢失已累计的专注时长。</p>' +
      '</div>' +
      '<div class="modal-foot">' +
      '<button type="button" class="btn" data-modal-close>取消</button>' +
      '<button type="button" class="btn primary" id="editSave">保存</button>' +
      '</div>';

    openOverlay(html);
    els.overlay.querySelectorAll('[data-modal-close]').forEach(function (btn) {
      btn.addEventListener('click', closeOverlay);
    });
    var nameInput = els.overlay.querySelector('#editName');
    function save() {
      var name = nameInput.value.trim();
      if (!name) {
        showToast('事项名称不能为空');
        nameInput.focus();
        return;
      }
      var checked = els.overlay.querySelector('input[name="editLevel"]:checked');
      core.editTask(id, { name: name, level: checked ? checked.value : row.level });
      closeOverlay();
      renderAll();
      scheduleSave();
      showToast('已保存修改');
    }
    els.overlay.querySelector('#editSave').addEventListener('click', save);
    nameInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        save();
      }
    });
  }

  function openNoteModal() {
    var input;
    var html =
      '<div class="modal-head"><h3>笔记板</h3><button type="button" class="icon-btn" data-modal-close aria-label="关闭">×</button></div>' +
      '<div class="modal-body">' +
      '<textarea id="noteInput" data-autofocus maxlength="200000" placeholder="记录这一天的思路、公式、待查资料……"></textarea>' +
      '<p class="modal-hint">内容会自动保存在本地，关闭软件不会丢失。</p>' +
      '</div>' +
      '<div class="modal-foot"><button type="button" class="btn primary" id="noteOk">OK</button></div>';

    openOverlay(html, {
      onClose: function () {
        if (noteTimer) clearTimeout(noteTimer);
        if (input) core.setNotes(input.value);
        saveNow();
        renderNotePreview();
      }
    });
    input = els.overlay.querySelector('#noteInput');
    input.value = core.state.notes;
    input.addEventListener('input', function () {
      clearTimeout(noteTimer);
      noteTimer = setTimeout(function () {
        core.setNotes(input.value);
        scheduleSave();
        renderNotePreview();
      }, 300);
    });
    els.overlay.querySelectorAll('[data-modal-close]').forEach(function (btn) {
      btn.addEventListener('click', closeOverlay);
    });
    els.overlay.querySelector('#noteOk').addEventListener('click', function () {
      core.setNotes(input.value);
      closeOverlay();
      renderNotePreview();
      scheduleSave();
    });
  }

  function clearCompleted() {
    var count = core.state.completed.length;
    if (!count) return;
    confirmDialog({
      title: '清空已完成事项',
      message: '将删除 ' + count + ' 个已完成事项，并从用时表格和总专注时长中扣除它们的时长。',
      okText: '清空',
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      core.clearCompleted();
      renderAll();
      scheduleSave();
      showToast('已清空完成事项');
    });
  }

  function deleteTask(id) {
    var row = core.tableRows().filter(function (item) { return item.id === id; })[0];
    if (!row) return;
    confirmDialog({
      title: '删除事项',
      message: '确定删除「' + row.name + '」？它的累计专注时长也会一并移除。',
      okText: '删除',
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      core.deleteTask(id);
      renderAll();
      scheduleSave();
      showToast('已删除事项');
    });
  }

  function handleTaskAction(action, id) {
    switch (action) {
      case 'flag': {
        if (!core.promoteTask(id)) return;
        renderAll();
        scheduleSave();
        if (core.state.status === 'focus' && core.state.running) {
          showToast('已开始专注「' + core.state.current.name + '」');
        } else {
          showToast('已设为正在完成的事项');
        }
        break;
      }
      case 'done': {
        if (!core.completeCurrent()) return;
        renderAll();
        scheduleSave();
        showToast('已完成，专注计时已暂停');
        break;
      }
      case 'edit':
        openEditModal(id);
        break;
      case 'up':
      case 'down':
        if (core.moveTask(id, action === 'up' ? -1 : 1)) {
          renderAll();
          scheduleSave();
        }
        break;
      case 'del':
        deleteTask(id);
        break;
      case 'return':
        if (core.returnCompleted(id)) {
          renderAll();
          scheduleSave();
          showToast('已退回到原分区');
        }
        break;
      default:
        break;
    }
  }

  /* ------------------------------------------------------------------ */
  /* 休息结束弹窗                                                        */
  /* ------------------------------------------------------------------ */

  function updateBreakOvertime() {
    var node = document.getElementById('breakOvertime');
    if (node) node.textContent = '+' + Core.formatClock(core.state.overtime);
  }

  function openBreakEndModal() {
    breakModalOpen = true;
    startBreakLoop();
    var html =
      '<div class="modal-head break-head"><h3>计时已结束</h3></div>' +
      '<div class="modal-body break-body">' +
      '<div class="break-overtime" id="breakOvertime">+00:00</div>' +
      '<p class="break-caption">休息时间已结束，超时正在累计</p>' +
      '<p class="modal-hint">按 OK 停止铃声，并进入专注。</p>' +
      '</div>' +
      '<div class="modal-foot center"><button type="button" class="btn primary" id="breakOk">OK</button></div>';

    openOverlay(html, {
      closable: false,
      onClose: function () {
        breakModalOpen = false;
      }
    });
    updateBreakOvertime();
    els.overlay.querySelector('#breakOk').addEventListener('click', function () {
      stopBreakLoop();
      core.acknowledgeBreak();
      closeOverlay();
      renderAll();
      scheduleSave();
      if (!core.state.current) {
        showToast('休息结束，请先选择正在完成的事项再开始专注');
      }
    });
  }

  /* ------------------------------------------------------------------ */
  /* 事件绑定                                                            */
  /* ------------------------------------------------------------------ */

  els.addBtn.addEventListener('click', openAddModal);
  els.noteBtn.addEventListener('click', openNoteModal);

  els.controls.addEventListener('click', function (event) {
    var btn = event.target.closest('button[data-cmd]');
    if (!btn) return;
    var cmd = btn.dataset.cmd;
    if (cmd === 'pause') {
      if (core.pause()) {
        renderAll();
        scheduleSave();
      }
    } else if (cmd === 'resume') {
      if (!core.start()) {
        showToast('请先在待办事项本中选择正在完成的事项');
      }
      renderAll();
      scheduleSave();
    } else if (cmd === 'reset') {
      doReset();
    } else if (cmd === 'switch') {
      doSwitchStatus();
    } else if (cmd === 'newday') {
      doNewDay();
    } else if (cmd === 'convert') {
      doConvert();
    } else if (cmd === 'break-short') {
      if (core.chooseBreak('short')) {
        renderAll();
        scheduleSave();
      }
    } else if (cmd === 'break-long') {
      if (core.chooseBreak('long')) {
        renderAll();
        scheduleSave();
      }
    }
  });

  els.taskBook.addEventListener('click', function (event) {
    var btn = event.target.closest('button[data-act]');
    if (!btn) return;
    var action = btn.dataset.act;
    if (action === 'clear-done') {
      clearCompleted();
      return;
    }
    var holder = btn.closest('[data-id]');
    if (!holder) return;
    handleTaskAction(action, holder.dataset.id);
  });

  els.toast.addEventListener('click', function (event) {
    if (event.target.id !== 'toastUndo' || !undoAction) return;
    var action = undoAction;
    clearToast();
    action();
  });

  els.overlay.addEventListener('mousedown', function (event) {
    if (event.target !== els.overlay || !activeModal || !activeModal.closable) return;
    closeOverlay();
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && activeModal && activeModal.closable) {
      closeOverlay();
    }
  });

  [['focus', els.devFocus], ['short', els.devShort], ['long', els.devLong]].forEach(function (pair) {
    var key = pair[0];
    var input = pair[1];
    input.addEventListener('change', function () {
      var value = parseInt(input.value, 10);
      if (!Number.isFinite(value) || value < 1 || value > 180) {
        input.value = core.state.settings[key];
        showToast('时长需在 1–180 分钟之间');
        return;
      }
      var patch = {};
      patch[key] = value;
      if (core.setSettings(patch)) {
        renderTimer();
        scheduleSave();
      }
    });
  });

  document.addEventListener('pointerdown', unlockAudio, { once: true });
  document.addEventListener('keydown', unlockAudio, { once: true });
  window.addEventListener('beforeunload', function () {
    flushOpenEditors();
    saveNow();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      flushOpenEditors();
      saveNow();
    }
  });

  /** 关闭页面 / 切到后台时，把仍打开的编辑框内容强制写回。 */
  function flushOpenEditors() {
    var note = document.getElementById('noteInput');
    if (note) core.setNotes(note.value);
    var draft = document.getElementById('addInput');
    if (draft) core.setDraft(draft.value);
  }

  core.onEvent = function (type) {
    if (type === 'focus-end') {
      playFocusEnd();
      renderAll();
      scheduleSave();
    } else if (type === 'break-end') {
      renderAll();
      scheduleSave();
      openBreakEndModal();
    }
  };

  /* ------------------------------------------------------------------ */
  /* 启动                                                                */
  /* ------------------------------------------------------------------ */

  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) core.hydrate(saved);
  } catch (err) {
    /* localStorage 不可用时使用内存状态 */
  }

  renderAll();
  renderDevValues();
  if (core.state.breakEnded) {
    setTimeout(openBreakEndModal, 250);
  }

  setInterval(function () {
    if (core.tick(Date.now())) {
      renderTimer();
      renderTable();
      renderTotals();
      updateBreakOvertime();
    }
    renderClock();
  }, 200);

  /* 供自动化冒烟测试与排查使用 */
  window.__POMODORO_APP__ = {
    core: core,
    renderAll: renderAll,
    saveNow: saveNow,
    version: '1.0.0'
  };
})();

</script>
</body>
</html>
